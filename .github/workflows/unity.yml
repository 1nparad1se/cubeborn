name: Unity build (Windows)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Unity ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: StandaloneWindows64
            method: BuildScript.BuildWindows
          - platform: StandaloneLinux64
            method: BuildScript.BuildLinux
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.platform }}-
      - uses: game-ci/unity-builder@v4
        # commits tagged [shots-only] rebuild just the desktop player for the screenshot check
        if: matrix.platform == 'StandaloneLinux64' || !contains(github.event.head_commit.message, '[shots-only]')
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: Cubeborn
          versioning: Custom
          version: 1.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
      - name: Pack output
        run: |
          sudo chown -R "$(id -u)" build || true
          ls -la build/${{ matrix.platform }} || true
          if [ "${{ matrix.platform }}" = "StandaloneWindows64" ]; then
            rm -rf build/StandaloneWindows64/*_BurstDebugInformation_DoNotShip
            (cd build/StandaloneWindows64 && zip -qr "$GITHUB_WORKSPACE/Cubeborn-Windows.zip" .)
            ls -la Cubeborn-Windows.zip
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'StandaloneWindows64'
        with:
          name: Cubeborn-windows
          path: Cubeborn-Windows.zip
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'StandaloneLinux64'
        with:
          name: Cubeborn-linux
          path: build/StandaloneLinux64

  # Runs the desktop build headless and captures screenshots of every screen (visual check).
  shots:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cubeborn-linux
          path: game
      - name: Capture screenshots
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libglu1-mesa mesa-vulkan-drivers gdb > /dev/null
          ls -la game
          EXE=$(find game -maxdepth 2 -type f \( -name "*.x86_64" -o -name "Cubeborn" \) | head -1)
          chmod +x "$EXE"
          mkdir -p shots
          play() { # $1 = log name, rest = extra player args
            local NAME=$1; shift
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 300 "$EXE" -force-glcore -screen-fullscreen 0 \
              -screen-width 1280 -screen-height 720 -logFile "$PWD/shots/$NAME.log" -cbshots "$PWD/shots" "$@" &
            local W=$!
            sleep 40
            local P=$(pgrep -n -x "Cubeborn.x86_64")
            if [ -n "$P" ] && ! grep -q "frame3" "shots/$NAME.log"; then
              echo "$NAME stalled; dumping stacks of $P"
              sudo gdb -p "$P" -batch -ex "info threads" -ex "thread apply all bt 30" > "shots/$NAME-stacks.txt" 2>&1 || true
              kill -9 "$P" || true
            fi
            wait $W || echo "exit $?"
            grep -E "\[cb|rror|xception" "shots/$NAME.log" | grep -v ALSA | uniq -c | head -40 || true
          }
          play player
          if [ ! -f shots/01_splash.png ]; then
            play player-noaudio -cbnoaudio
            play player-nographics -nographics
          fi
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cubeborn-shots
          path: shots
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view unity-shots --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create unity-shots --repo "${{ github.repository }}" --prerelease --title "Unity CI screenshots" --notes "Latest CI screenshots"
          ls shots/* > /dev/null 2>&1 && gh release upload unity-shots shots/* --clobber --repo "${{ github.repository }}"

  release:
    needs: build
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[shots-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cubeborn-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "unity-${{ github.run_number }}" Cubeborn-Windows.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Cubeborn Unity ${{ github.run_number }} (Windows)" \
            --notes "Unity build for Windows from ${{ github.ref_name }} (${{ github.sha }}). Unzip and run Cubeborn.exe."
