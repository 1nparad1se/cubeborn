name: Unity build (Android APK + iOS IPA)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Unity ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            method: BuildScript.BuildAndroid
          - platform: iOS
            method: BuildScript.BuildIOS
          - platform: StandaloneLinux64
            method: BuildScript.BuildLinux
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.platform }}-
      - uses: game-ci/unity-builder@v4
        # commits tagged [shots-only] rebuild just the desktop player for the screenshot check
        if: matrix.platform == 'StandaloneLinux64' || !contains(github.event.head_commit.message, '[shots-only]')
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.method }}
          buildName: Cubeborn
          versioning: Custom
          version: 1.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
      - name: Pack output
        run: |
          sudo chown -R "$(id -u)" build || true
          ls -la build/${{ matrix.platform }} || true
          if [ "${{ matrix.platform }}" = "iOS" ]; then tar -czf xcode.tgz -C build/iOS .; fi
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'Android'
        with:
          name: Cubeborn-apk
          path: build/Android/*.apk
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'iOS'
        with:
          name: Cubeborn-xcode
          path: xcode.tgz
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'StandaloneLinux64'
        with:
          name: Cubeborn-linux
          path: build/StandaloneLinux64

  # Runs the desktop build headless and captures screenshots of every screen (visual check).
  shots:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cubeborn-linux
          path: game
      - name: Capture screenshots
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libglu1-mesa mesa-vulkan-drivers gdb > /dev/null
          ls -la game
          EXE=$(find game -maxdepth 2 -type f \( -name "*.x86_64" -o -name "Cubeborn" \) | head -1)
          chmod +x "$EXE"
          mkdir -p shots
          play() { # $1 = graphics flag, $2 = log name
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 300 "$EXE" $1 -screen-fullscreen 0 \
              -screen-width 1280 -screen-height 720 -logFile "$PWD/shots/$2.log" -cbshots "$PWD/shots" &
            local W=$!
            sleep 40
            local P=$(pgrep -f "Cubeborn.x86_64" | head -1)
            if [ -n "$P" ] && ! grep -q "frame3" "shots/$2.log"; then
              echo "stalled; dumping stacks of $P"
              sudo gdb -p "$P" -batch -ex "thread apply all bt 25" > "shots/$2-stacks.txt" 2>&1 || true
              kill -QUIT "$P" || true
              sleep 3
            fi
            wait $W || echo "exit $?"
          }
          play -force-glcore player
          grep -E "\[cb|rror|xception" shots/player.log | grep -v ALSA | uniq -c | head -60 || true
          if [ ! -f shots/01_splash.png ]; then
            play -force-vulkan player-vk
            grep -E "\[cb|rror|xception" shots/player-vk.log | grep -v ALSA | uniq -c | head -60 || true
          fi
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cubeborn-shots
          path: shots
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view unity-shots --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create unity-shots --repo "${{ github.repository }}" --prerelease --title "Unity CI screenshots" --notes "Latest CI screenshots"
          ls shots/* > /dev/null 2>&1 && gh release upload unity-shots shots/* --clobber --repo "${{ github.repository }}"

  ipa:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cubeborn-xcode
      - name: Build unsigned IPA
        run: |
          mkdir xcode && tar -xzf xcode.tgz -C xcode
          cd xcode
          PROJ=$(find . -maxdepth 2 -name "Unity-iPhone.xcodeproj" | head -1)
          cd "$(dirname "$PROJ")"
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -50
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "*.app" -maxdepth 2 | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/Cubeborn-Unity.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/Cubeborn-Unity.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Cubeborn-ipa
          path: Cubeborn-Unity.ipa

  release:
    needs: [build, ipa]
    if: ${{ !cancelled() && needs.ipa.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find out/Cubeborn-apk -name "*.apk" | head -1)
          cp "$APK" Cubeborn-Unity.apk
          gh release create "unity-${{ github.run_number }}" Cubeborn-Unity.apk out/Cubeborn-ipa/Cubeborn-Unity.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Cubeborn Unity ${{ github.run_number }}" \
            --notes "Unity build from ${{ github.ref_name }} (${{ github.sha }}). APK for Android, unsigned IPA for Sideloadly."
