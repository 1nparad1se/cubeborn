<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Схема континента</title>
<style>:root{--panel:#161a22db;--text:#f2efe6;--muted:#b9b4a6;--accent:#ffcf5a;--line:#ffffff1f}@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--panel:#161a22db}}:root[data-theme=dark]{--panel:#161a22db}html,body{height:100%;color:var(--text);background:#10141b;margin:0;font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}#app{position:fixed;inset:0}canvas{display:block}.panel{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:10px;padding:10px 12px;position:absolute}#ui{width:240px;max-height:calc(100% - 24px);top:12px;left:12px;overflow:auto}#legend{width:230px;max-height:calc(100% - 24px);bottom:12px;right:12px;overflow:auto}h1{color:var(--accent);letter-spacing:.02em;margin:0 0 6px;font-size:15px}h2{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;font-size:12px}label{cursor:pointer;align-items:center;gap:6px;margin:2px 0;display:flex}input[type=range]{width:100%}.btns{flex-wrap:wrap;gap:4px;display:flex}button{color:var(--text);border:1px solid var(--line);font:inherit;cursor:pointer;background:#2b3342;border-radius:6px;padding:3px 7px;font-size:12px}button:hover{background:#3a4558}button.on{border-color:var(--accent);background:#6b5521}.sw{vertical-align:-2px;border:1px solid #00000059;border-radius:3px;width:12px;height:12px;margin-right:6px;display:inline-block}.row{justify-content:space-between;gap:8px;display:flex}.bar{border-radius:5px;height:10px;margin:4px 0 6px;display:flex;overflow:hidden}#labels{pointer-events:none;position:absolute;inset:0;overflow:hidden}.lbl{white-space:nowrap;text-shadow:0 0 3px #000,0 0 2px #000,0 1px 2px #000;font-weight:600;position:absolute;transform:translate(-50%,-100%)}.lbl.village{color:#fff;font-size:15px}.lbl.village:after{content:"";background:#ffcf5a;border:2px solid #3b2a07;width:9px;height:9px;margin:2px auto 0;display:block;transform:rotate(45deg)}.lbl.landmark{color:#ffe9a8;font-size:12px}.lbl.landmark:after{content:"▲";text-align:center;color:#ffcf5a;font-size:9px;display:block}.lbl.region{color:#ffffffeb;letter-spacing:.04em;text-transform:uppercase;font-size:13px;font-weight:700;transform:translate(-50%,-50%)}.lbl.region small{text-align:center;letter-spacing:0;color:#ffd98a;text-transform:none;font-size:10px;font-weight:600;display:block}.lbl.pass{color:#ffd0f0;font-size:11px}.lbl.pass:after{content:"⌒";text-align:center;display:block}.lbl.bridge{color:#fff;font-size:10px}.lbl.tunnel{color:#e0b0ff;font-size:10px}.lbl.ridge{color:#dfe7f0;font-size:11px;font-style:italic;transform:translate(-50%,-50%)}#hint{color:var(--muted);font-size:11px;position:absolute;bottom:10px;left:50%;transform:translate(-50%)}#loading{color:var(--accent);place-items:center;font-size:16px;display:grid;position:absolute;inset:0}@media (width<=640px){#ui{width:auto;max-height:40%;right:12px}#legend{display:none}}</style>
  <script type="module" crossorigin src="./assets/index-CZk4msSI.js"></script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="loading">Загрузка рельефа…</div>
<div id="ui" class="panel">
  <h1>Континент · 8000×8000</h1>
  <div style="color:var(--muted)">Этап 2: рельефная схема. Без построек, деревьев и мобов.</div>
  <h2>Вид</h2>
  <div class="btns" id="views"></div>
  <h2>Окраска</h2>
  <label><input type="radio" name="col" value="biome" checked> Биомы</label>
  <label><input type="radio" name="col" value="height"> Высоты</label>
  <label><input type="radio" name="col" value="major"> Три зоны (55/25/20)</label>
  <h2>Рельеф</h2>
  <div class="row"><span>Вертикальный масштаб</span><b id="exv">×1.5</b></div>
  <input id="ex" type="range" min="0.5" max="4" step="0.1" value="1.5">
  <label><input type="checkbox" id="top"> Режим 2D (сверху)</label>
  <label><input type="checkbox" id="hi" checked> Детальная сетка (1024²)</label>
  <h2>Слои</h2>
  <label><input type="checkbox" data-layer="water" checked> Реки, озёра, море</label>
  <label><input type="checkbox" data-layer="roads" checked> Дороги, мосты, перевалы, туннели</label>
  <label><input type="checkbox" data-layer="regions" checked> Границы регионов</label>
  <label><input type="checkbox" data-layer="regionNames" checked> Названия регионов и уровни</label>
  <label><input type="checkbox" data-layer="places" checked> Деревни и ориентиры</label>
  <label><input type="checkbox" data-layer="ridges"> Названия хребтов</label>
  <label><input type="checkbox" data-layer="grid"> Сетка секторов 1000 блоков</label>
</div>
<div id="legend" class="panel"></div>
<div id="hint">ЛКМ — вращение · ПКМ — сдвиг · колесо — масштаб</div>
</body>
</html>
